[workspace]
resolver = "2"
members = [
    "rust/crates/fast-nc-zarr-model",
    "rust/crates/fast-nc-zarr-zarr",
    "rust/crates/fast-nc-zarr-python",
]

[workspace.package]
version = "1.6.9"
edition = "2021"
rust-version = "1.83"

[workspace.dependencies]
fast-nc-zarr-zarr = { path = "rust/crates/fast-nc-zarr-zarr" }
fast-nc-zarr-model = { path = "rust/crates/fast-nc-zarr-model" }
pyo3 = { version = "0.29", features = ["extension-module"] }
serde = { version = "1.0", features = ["derive"] }
zarrs = "0.23.13"
zarrs_filesystem = "0.3.12"
ndarray = "0.17.2"
thiserror = "2.0"
serde_json = "1.0"
