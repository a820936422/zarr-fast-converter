[workspace]
name = "fast-nc-zarr"
version = "1.6.4"
description = "Reproducible development environment for the fast Zarr converter"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.13.*"
dask = ">=2026.7.1,<2027"
esmf = ">=8.9.1,<9"
gdal = ">=3.12.3,<4"
h5netcdf = ">=1.8.1,<2"
netcdf4 = ">=1.7.4,<2"
numcodecs = ">=0.16,<0.17"
numpy = ">=2.4.6,<3"
psutil = ">=7.2,<8"
pyside6 = ">=6.11,<7"
pyqtgraph = ">=0.14,<0.15"
pytest = ">=9.1,<10"
rasterio = ">=1.5,<2"
rioxarray = ">=0.23,<0.24"
xarray = ">=2026.7,<2027"
xesmf = ">=0.9.2,<0.10"
zarr = ">=3.3,<4"

[activation.env]
PYTHONPATH = "${PIXI_PROJECT_ROOT}/src"

[tasks]
convert = "python -m fast_nc_zarr"
pipeline = "python -m fast_nc_zarr.pipeline"
resample = "python -m fast_nc_zarr.resampling"
rechunk = "python -m fast_nc_zarr.rechunking"
gui = "python -m fast_nc_zarr.gui.app"
validate-raw = "python -m fast_nc_zarr.raw_validation"
test = "mkdir -p /tmp/codex_test/fast_nc_zarr_pixi && TMPDIR=/tmp/codex_test/fast_nc_zarr_pixi QT_QPA_PLATFORM=offscreen python -m pytest -q --basetemp=/tmp/codex_test/fast_nc_zarr_pixi/pytest_tmp"
