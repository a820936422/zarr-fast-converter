[workspace]
name = "fast-nc-zarr"
version = "1.7.9"
description = "Reproducible development environment for the fast Zarr converter"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.13.*"
dask = ">=2026.7.1,<2027"
esmf = ">=8.9.1,<9"
gdal = ">=3.12.3,<4"
h5netcdf = ">=1.8.1,<2"
netcdf4 = ">=1.7.4,<2"
numcodecs = ">=0.16,<0.17"
numpy = ">=2.4.6,<3"
psutil = ">=7.2,<8"
jsonschema = ">=4.25,<5"
pytest = ">=9.1,<10"
rasterio = ">=1.5,<2"
rioxarray = ">=0.23,<0.24"
xarray = ">=2026.7,<2027"
xesmf = ">=0.9.2,<0.10"
zarr = ">=3.3,<4"
rust = ">=1.83,<2"
maturin = ">=1.8,<2"
pyinstaller = ">=6.22,<7"
pkg-config = ">=0.29.2,<0.30"
cmake = ">=4.4.2,<5"
ninja = ">=1.13.2,<2"
patchelf = ">=0.17.2,<0.18"
pip = ">=26.2.1,<27"
ruff = ">=0.16.3,<0.17"
[activation.env]
PYTHONPATH = "${PIXI_PROJECT_ROOT}/src"

[tasks]
convert = "python -m fast_nc_zarr"
pipeline = "python -m fast_nc_zarr.pipeline"
resample = "python -m fast_nc_zarr.resampling"
rechunk = "python -m fast_nc_zarr.rechunking"
gui = "bash scripts/desktop_dev.sh"
validate-raw = "python -m fast_nc_zarr.raw_validation"
test = "mkdir -p /tmp/codex_test/fast_nc_zarr_pixi && TMPDIR=/tmp/codex_test/fast_nc_zarr_pixi python -m pytest -q --basetemp=/tmp/codex_test/fast_nc_zarr_pixi/pytest_tmp"
version-check = "python scripts/check_version_consistency.py"
contract-check = "python scripts/check_contracts.py"
python-lint = "python -m ruff check src tests scripts --select F,E9"
benchmark-native-resample = "python scripts/benchmark_native_resampling.py"
benchmark-filename-ab = "python scripts/benchmark_filename_ab.py"
benchmark-conservative-resample-ab = "python scripts/benchmark_conservative_resampling_ab.py"
benchmark-hardware-profile = "python scripts/benchmark_hardware_profile.py"
native-check = "python scripts/check_native_environment.py"
cross-backend-test = "mkdir -p /tmp/codex_test/fast_nc_zarr_pixi && TMPDIR=/tmp/codex_test/fast_nc_zarr_pixi python -m pytest -q tests/test_protocol.py tests/test_native_smoke.py --basetemp=/tmp/codex_test/fast_nc_zarr_pixi/pytest_tmp"
native-develop = "CFLAGS=-std=gnu17 maturin develop --release --skip-install"
native-build = "CFLAGS=-std=gnu17 maturin build --release"
rust-test = "CFLAGS=-std=gnu17 cargo test --workspace --exclude fast-nc-zarr-desktop"
rust-desktop-test = "bash -lc 'source scripts/desktop_linker_env.sh && CFLAGS=-std=gnu17 cargo test -p fast-nc-zarr-desktop --lib'"
rust-fmt-check = "cargo fmt --all -- --check"
rust-clippy = "CFLAGS=-std=gnu17 cargo clippy --workspace --exclude fast-nc-zarr-desktop --all-targets -- -D warnings"
desktop-install = "npm --prefix apps/desktop ci"
desktop-typecheck = "npm --prefix apps/desktop run typecheck"
desktop-build = "npm --prefix apps/desktop run build"
desktop-worker = "python -m fast_nc_zarr.application.desktop_worker"
sidecar-check = "python scripts/check_sidecar.py"
tauri-build = "bash scripts/build_desktop.sh"
desktop-sidecar = "bash scripts/build_desktop_sidecar.sh"
desktop-sidecar-target = "bash scripts/build_desktop_sidecar.sh"
desktop-release-check = "pixi run version-check && pixi run sidecar-check && pixi run desktop-typecheck && pixi run desktop-build && pixi run native-check"
release-candidate = "bash scripts/collect_release_candidate.sh"
