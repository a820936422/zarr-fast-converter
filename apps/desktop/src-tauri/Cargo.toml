[package]
name = "fast-nc-zarr-desktop"
version = "1.7.9"
description = "Tauri desktop shell for Fast NC Zarr"
authors = ["Fast NC Zarr contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.97"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
serde_json.workspace = true
serde = { workspace = true }
log = "0.4"
tauri.workspace = true
tauri-plugin-log.workspace = true
fast-nc-zarr-model.workspace = true
fast-nc-zarr-zarr.workspace = true
uuid = { version = "1.24", features = ["v4"] }
tauri-plugin-dialog.workspace = true
