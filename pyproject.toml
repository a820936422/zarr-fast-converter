[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fast-nc-zarr"
version = "1.3.0"
description = "Adaptive high-throughput NetCDF to Zarr v3 converter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "dask",
  "h5netcdf",
  "netCDF4",
  "numcodecs",
  "numpy",
  "psutil",
  "rasterio",
  "rioxarray",
  "xarray",
  "xesmf>=0.9",
  "zarr>=3",
]

[project.scripts]
fast-nc-zarr = "fast_nc_zarr.cli:main"
fast-zarr-rechunk = "fast_nc_zarr.rechunking.cli:main"
fast-zarr-resample = "fast_nc_zarr.resampling.cli:main"
fast-zarr-pipeline = "fast_nc_zarr.pipeline.cli:main"
fast-zarr-gui = "fast_nc_zarr.gui.app:main"
fast-zarr-validate-raw = "fast_nc_zarr.raw_validation:main"

[project.optional-dependencies]
gui = [
  "PySide6>=6.8",
  "pyqtgraph>=0.13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
