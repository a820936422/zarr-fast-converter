[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "fast-nc-zarr"
version = "1.7.2"
description = "Fast NetCDF, HDF and TIFF to Zarr v3 conversion toolkit"
requires-python = ">=3.13"

[tool.maturin]
manifest-path = "rust/crates/fast-nc-zarr-python/Cargo.toml"
python-source = "src"
module-name = "fast_nc_zarr._native"
