name: Native preparation

on:
  push:
    branches:
      - main
      - develop
  pull_request:
concurrency:
  group: native-preparation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-preparation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.76.1
          cache: true

      - name: Check version consistency
        run: pixi run version-check
      - name: Check native environment
        run: pixi run native-check

      - name: Check Rust formatting
        run: pixi run rust-fmt-check

      - name: Run Rust core tests
        run: pixi run rust-test

      - name: Run Rust clippy
        run: pixi run rust-clippy


      - name: Run native protocol smoke tests
        run: pixi run cross-backend-test

      - name: Run existing Python suite
        run: pixi run test 2>&1 | tee /tmp/fast-nc-zarr-python-suite.log
      - name: Upload Python suite failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fast-nc-zarr-python-suite-log
          if-no-files-found: ignore
          path: /tmp/fast-nc-zarr-python-suite.log


  desktop-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Linux Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            rpm
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.76.1
          cache: true
      - name: Build Linux sidecar
        run: pixi run desktop-sidecar
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install desktop dependencies
        run: npm --prefix apps/desktop ci
      - name: Check desktop frontend
        run: npm --prefix apps/desktop run build
      - name: Check Tauri configuration
        run: npm --prefix apps/desktop exec tauri info
      - name: Build Linux deb and rpm packages
        env:
          TAURI_BUNDLES: deb,rpm
        run: bash scripts/build_desktop.sh --target x86_64-unknown-linux-gnu --ci --no-sign
      - name: Verify Linux package counts
        id: package_count
        shell: bash
        run: |
          shopt -s nullglob
          debs=(target/release/bundle/deb/*.deb)
          rpms=(target/release/bundle/rpm/*.rpm)
          printf 'deb_count=%s rpm_count=%s\\n' "${#debs[@]}" "${#rpms[@]}"
          test "${#debs[@]}" -eq 1
          test "${#rpms[@]}" -eq 1
      - name: Verify deb metadata
        id: deb_metadata
        shell: bash
        run: |
          shopt -s nullglob
          debs=(target/release/bundle/deb/*.deb)
          test "${#debs[@]}" -eq 1
          dpkg-deb --info "${debs[0]}"
      - name: Verify deb worker path
        id: deb_worker
        shell: bash
        run: |
          shopt -s nullglob
          debs=(target/release/bundle/deb/*.deb)
          test "${#debs[@]}" -eq 1
          dpkg-deb --contents "${debs[0]}" | grep -F 'usr/bin/fast-nc-zarr-worker'
      - name: Verify rpm metadata
        id: rpm_metadata
        shell: bash
        run: |
          shopt -s nullglob
          rpms=(target/release/bundle/rpm/*.rpm)
          test "${#rpms[@]}" -eq 1
          rpm -qpi "${rpms[0]}"
      - name: Verify rpm worker path
        id: rpm_worker
        shell: bash
        run: |
          shopt -s nullglob
          rpms=(target/release/bundle/rpm/*.rpm)
          test "${#rpms[@]}" -eq 1
          rpm -qpl "${rpms[0]}" | grep -F '/usr/bin/fast-nc-zarr-worker'
      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: fast-nc-zarr-linux-packages
          if-no-files-found: error
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm