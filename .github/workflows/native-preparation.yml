name: Native preparation

on:
  push:
    branches:
      - main
      - develop
  pull_request:
concurrency:
  group: native-preparation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-preparation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.76.1
          cache: true

      - name: Check version consistency
        run: pixi run version-check
      - name: Check native environment
        run: pixi run native-check

      - name: Check Rust formatting
        run: pixi run rust-fmt-check

      - name: Run Rust core tests
        run: pixi run rust-test

      - name: Run Rust clippy
        run: pixi run rust-clippy


      - name: Run native protocol smoke tests
        run: pixi run cross-backend-test

      - name: Run existing Python suite
        run: pixi run test 2>&1 | tee /tmp/fast-nc-zarr-python-suite.log
      - name: Upload Python suite failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fast-nc-zarr-python-suite-log
          if-no-files-found: ignore
          path: /tmp/fast-nc-zarr-python-suite.log


  desktop-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Linux Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            rpm
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.76.1
          cache: true
      - name: Build Linux sidecar
        run: pixi run desktop-sidecar
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install desktop dependencies
        run: npm --prefix apps/desktop ci
      - name: Check desktop frontend
        run: npm --prefix apps/desktop run build
      - name: Check Tauri configuration
        run: npm --prefix apps/desktop exec tauri info
      - name: Build Linux deb and rpm packages
        env:
          TAURI_BUNDLES: deb,rpm
        run: bash scripts/build_desktop.sh --target x86_64-unknown-linux-gnu --ci --no-sign
      - name: Verify Linux packages
        id: verify-linux-packages
        continue-on-error: true
        shell: bash
        run: |
          exec > >(tee /tmp/linux-package-verify.log) 2>&1
          set -uo pipefail
          shopt -s nullglob
          failed=0
          debs=(target/release/bundle/deb/*.deb)
          rpms=(target/release/bundle/rpm/*.rpm)
          printf 'deb_count=%s rpm_count=%s\\n' "${#debs[@]}" "${#rpms[@]}"
          if (( ${#debs[@]} != 1 || ${#rpms[@]} != 1 )); then
            echo "::error title=Linux package verification::expected one deb and one rpm; got deb=${#debs[@]} rpm=${#rpms[@]}"
            failed=1
          else
            if dpkg-deb --info "${debs[0]}"; then
              echo 'deb metadata: ok'
            else
              echo '::error title=Linux package verification::dpkg-deb --info failed'
              failed=1
            fi
            if dpkg-deb --contents "${debs[0]}" | grep -F 'usr/bin/fast-nc-zarr-worker'; then
              echo 'deb worker path: ok'
            else
              echo '::error title=Linux package verification::deb worker path missing'
              failed=1
            fi
            if rpm -qpi "${rpms[0]}"; then
              echo 'rpm metadata: ok'
            else
              echo '::error title=Linux package verification::rpm -qpi failed'
              failed=1
            fi
            if rpm -qpl "${rpms[0]}" | grep -F '/usr/bin/fast-nc-zarr-worker'; then
              echo 'rpm worker path: ok'
            else
              echo '::error title=Linux package verification::rpm worker path missing'
              failed=1
            fi
          fi
          if (( failed != 0 )); then exit 1; fi
      - name: Upload Linux package verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-nc-zarr-linux-package-verify-log
          if-no-files-found: ignore
          path: /tmp/linux-package-verify.log
      - name: Enforce Linux package verification
        if: steps.verify-linux-packages.outcome == 'failure'
        run: exit 1
      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: fast-nc-zarr-linux-packages
          if-no-files-found: error
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm