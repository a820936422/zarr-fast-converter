name: Native preparation

on:
  push:
    branches:
      - main
      - "refactor/**"
  pull_request:

permissions:
  contents: read

jobs:
  native-preparation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.76.1
          cache: true

      - name: Check native environment
        run: pixi run native-check

      - name: Check Rust formatting
        run: pixi run rust-fmt-check

      - name: Run Rust tests
        run: pixi run rust-test

      - name: Run Rust clippy
        run: pixi run rust-clippy


      - name: Run native protocol smoke tests
        run: pixi run cross-backend-test

      - name: Run existing Python suite
        run: pixi run test


  desktop-release:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install desktop dependencies
        run: npm --prefix apps/desktop ci
      - name: Check desktop frontend
        run: npm --prefix apps/desktop run build
      - name: Check Tauri configuration
        run: npm --prefix apps/desktop exec tauri info
      - name: Build target desktop package
        if: runner.os == 'Linux'
        env:
          CI: false
        run: npm --prefix apps/desktop exec tauri build -- --target ${{ matrix.target }} --bundles deb,rpm